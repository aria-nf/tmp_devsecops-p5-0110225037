{% extends 'base.html' %}

{% block header %}
<div class="max-w-2xl mx-auto mb-4">
  <div class="flex items-center gap-1.5 text-xs text-slate-500 mb-1">
    <a href="{{ url_for('index') }}" class="hover:text-primary-600">Posts</a>
    <span>/</span>
    <span class="text-slate-700 font-medium">Edit Post</span>
  </div>
  <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{% block title %}Edit "{{ post['title'] }}"{% endblock %}
  </h1>
</div>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-4">
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
    <form method="post" class="space-y-4">
      <div>
        <label for="title" class="block text-xs font-semibold text-slate-700 mb-1.5">Title</label>
        <input name="title" id="title" value="{{ request.form['title'] or post['title'] }}" required
          class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 font-medium transition"
          placeholder="Judul postingan...">
      </div>

      <div>
        <label for="body" class="block text-xs font-semibold text-slate-700 mb-1.5">Body</label>
        <textarea name="body" id="body" rows="6"
          class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 transition leading-relaxed"
          placeholder="Isi konten postingan...">{{ request.form['body'] or post['body'] }}</textarea>
      </div>

      <div class="flex items-center justify-between pt-3 border-t border-slate-100">
        <a href="{{ url_for('index') }}"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">
          Batal
        </a>
        <input type="submit" value="Save"
          class="px-5 py-2 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-semibold text-xs shadow-sm cursor-pointer transition">
      </div>
    </form>

    <div class="mt-6 pt-4 border-t border-rose-100 flex items-center justify-between">
      <div>
        <span class="text-xs font-semibold text-rose-600">Hapus Postingan</span>
        <p class="text-[11px] text-slate-500">Tindakan ini tidak dapat dibatalkan.</p>
      </div>
      <form action="{{ url_for('blog.delete', id=post['id']) }}" method="post">
        <input
          class="danger px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-semibold cursor-pointer transition"
          type="submit" value="Delete" onclick="return confirm('Are you sure?');">
      </form>
    </div>
  </div>
</div>
{% endblock %}
