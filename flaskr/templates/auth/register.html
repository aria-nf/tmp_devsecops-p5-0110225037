{% extends 'base.html' %}

{% block header %}
  <div class="max-w-sm mx-auto text-center mb-5">
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{% block title %}Register{% endblock %}</h1>
    <p class="text-xs text-slate-500 mt-1">Daftar akun baru untuk mulai menulis.</p>
  </div>
{% endblock %}

{% block content %}
  <div class="max-w-sm mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
      <form method="post" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
          <input name="username" id="username" required
            class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 transition"
            placeholder="Username baru">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
          <input type="password" name="password" id="password" required
            class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 transition"
            placeholder="Password rahasia">
        </div>

        <div class="pt-1">
          <input type="submit" value="Register"
            class="w-full py-2.5 px-4 rounded-lg bg-primary-600 hover:bg-primary-700 text-white font-semibold text-xs shadow-sm cursor-pointer transition">
        </div>
      </form>

      <div class="mt-4 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        Sudah punya akun?
        <a href="{{ url_for('auth.login') }}" class="font-semibold text-primary-600 hover:text-primary-700 ml-1">Log In</a>
      </div>
    </div>
  </div>
{% endblock %}
